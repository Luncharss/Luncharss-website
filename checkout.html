<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | Lunar's Shop</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="hero-box">

        <h1>💳 Checkout</h1>

        <p>Lengkapi data berikut untuk menyelesaikan pesananmu.</p>

        <div class="nav-btn">

            <a href="index.html" class="btn checkout">
                🏠 Beranda
            </a>

            <a href="cart.html" class="btn cart">
                🛒 Keranjang
            </a>

        </div>

    </div>

</header>

<section class="container">

    <div class="product" style="width:700px;max-width:100%;padding:30px;">

        <h2 style="text-align:center;margin-bottom:25px;">
            Data Pembeli
        </h2>

        <form id="checkoutForm">

            <label>Nama Lengkap</label>

            <input
                type="text"
                id="nama"
                placeholder="Masukkan nama lengkap"
                required>

            <br><br>

            <label>Nomor HP</label>

            <input
                type="tel"
                id="hp"
                placeholder="08xxxxxxxxxx"
                required>

            <br><br>

            <label>Kelas & Ruangan</label>

            <input
                type="text"
                id="kelas"
                placeholder="Contoh: XI TKJ 3"
                required>

            <br><br>

            <label>Metode Pembayaran</label>

            <select id="metode" required>

                <option value="COD/Cash">
                    COD / Cash
                </option>

            </select>

            <div id="paymentInfo" style="margin-top:20px;"></div>

            <br>

            <h3>🛒 Ringkasan Pesanan</h3>

            <div id="orderList"></div>

            <hr>

            <h2>
                Total :
                <span id="totalHarga">
                    Rp0
                </span>
            </h2>

            <br>

            <button
                type="submit"
                class="btn checkout"
                style="width:100%;font-size:18px;">

                ✅ Buat Pesanan via WhatsApp

            </button>

        </form>

    </div>

</section>

<footer>

    © 2026 Lunar's Shop | Soft Cookies, Delivered to Your Class!

</footer>

<script src="checkout.js"></script>

</body>
</html>
